{% if messages %}
<div class="mb-6 space-y-3">
    {% for message in messages %}
    <div class="rounded-2xl border border-slate-200 bg-white/90 px-4 py-3 text-sm shadow-sm dark:border-slate-700 dark:bg-slate-900/80
        {% if message.tags == 'error' %}border-rose-200 bg-rose-50 text-rose-700 dark:border-rose-700 dark:bg-rose-950/60 dark:text-rose-200{% elif message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-700 dark:border-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-200{% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-700 dark:border-amber-700 dark:bg-amber-950/60 dark:text-amber-200{% else %}border-sky-200 bg-sky-50 text-sky-700 dark:border-sky-700 dark:bg-sky-950/60 dark:text-sky-200{% endif %}">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
